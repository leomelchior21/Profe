<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Profe · Painel de aprendizagem</title>
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/print.css" media="print">
</head>
<body>

<div class="shell" id="app">
  <!-- ============================== CABEÇALHO ============================== -->
  <header class="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 40 40" role="img" aria-label="Profe">
        <defs>
          <linearGradient id="marca-profe" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#3d2a68"/>
            <stop offset="1" stop-color="#171a1d"/>
          </linearGradient>
        </defs>
        <rect width="40" height="40" rx="11" fill="url(#marca-profe)"/>
        <path d="M14.6 29.4V11.2h6.7a5.6 5.6 0 0 1 0 11.2h-4.6" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="28.9" cy="27.6" r="2.4" fill="#a78bfa"/>
      </svg>
      <div class="brand-text">
        <span class="brand-name">Profe</span>
        <span class="brand-sub">Escola Nova Lourenço Castanho</span>
      </div>
    </div>

    <nav class="filterbar" aria-label="Filtros do painel">
      <div class="filter filter-aluno">
        <label for="f-aluno">Aluno</label>
        <select id="f-aluno"></select>
      </div>
      <div class="filter">
        <label for="f-turma">Turma</label>
        <select id="f-turma"></select>
      </div>
      <div class="filter">
        <label for="f-disciplina">Disciplina</label>
        <select id="f-disciplina"></select>
      </div>
      <div class="filter">
        <label for="f-bimestre">Bimestre</label>
        <select id="f-bimestre"></select>
      </div>
      <div class="filter">
        <label for="f-ano">Ano escolar</label>
        <select id="f-ano"></select>
      </div>
      <div class="filter">
        <label for="f-ano-letivo">Ano letivo</label>
        <select id="f-ano-letivo"></select>
      </div>
      <div class="filter filter-limpar">
        <button type="button" id="btn-limpar" class="btn ghost">Limpar filtros</button>
      </div>
    </nav>
  </header>

  <main id="view" class="view" aria-live="polite"></main>

  <!-- =============================== RODAPÉ =============================== -->
  <footer class="app-foot" title="Todo o processamento acontece localmente neste navegador; nenhum dado de estudante é enviado para servidores.">
    <nav class="nav-tabs" aria-label="Seções do painel">
      <button type="button" class="nav-tab" data-alvo="aluno">Visão geral</button>
      <button type="button" class="nav-tab" data-alvo="trajetoria">Trajetória</button>
      <button type="button" class="nav-tab" data-alvo="disciplinas-tabela">Disciplinas</button>
      <button type="button" class="nav-tab" data-alvo="contexto">Contexto</button>
      <button type="button" class="nav-tab" data-alvo="padroes">Padrões</button>
      <button type="button" class="nav-tab" data-alvo="detalhados">Dados</button>
    </nav>
    <span class="foot-sep" aria-hidden="true"></span>
    <div class="foot-actions">
      <span class="scope-line" id="scope-line" aria-live="polite"></span>
      <button type="button" class="chip-alertas oculto" id="chip-alertas">
        <span class="alerta-icone" aria-hidden="true"></span>
        Pontos de atenção <b id="chip-alertas-num">0</b>
      </button>
      <span id="nav-aluno" class="nav-aluno"></span>
      <button type="button" id="btn-reuniao" class="btn">Modo reunião</button>
      <button type="button" id="btn-resumo" class="btn primary">Gerar resumo</button>
    </div>
  </footer>
</div>

<!-- ============================== MODO REUNIÃO ============================= -->
<div id="meeting" class="meeting" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Modo reunião">
  <header class="meeting-head">
    <span class="meeting-brand">
      <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true">
        <defs>
          <linearGradient id="marca-profe2" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#3d2a68"/>
            <stop offset="1" stop-color="#171a1d"/>
          </linearGradient>
        </defs>
        <rect width="40" height="40" rx="11" fill="url(#marca-profe2)"/>
        <path d="M14.6 29.4V11.2h6.7a5.6 5.6 0 0 1 0 11.2h-4.6" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="28.9" cy="27.6" r="2.4" fill="#a78bfa"/>
      </svg>
      <span>Profe</span>
    </span>
    <div id="meeting-step-head" class="meeting-step-head"></div>
    <div class="meeting-actions">
      <button type="button" id="meeting-print" class="btn">Gerar resumo</button>
      <button type="button" id="meeting-close" class="btn ghost">Sair (Esc)</button>
    </div>
  </header>
  <div id="meeting-body" class="meeting-body"></div>
  <footer class="meeting-foot">
    <button type="button" id="meeting-prev" class="btn">← Anterior</button>
    <div class="meeting-foot-centro">
      <div id="meeting-progress" class="meeting-progress" role="tablist" aria-label="Passos da reunião"></div>
      <span id="meeting-step-label" class="meeting-step-label"></span>
      <span id="meeting-aluno" class="meeting-aluno"></span>
    </div>
    <button type="button" id="meeting-next" class="btn primary">Próximo →</button>
  </footer>
</div>

<!-- ============================ RESUMO IMPRESSO ============================ -->
<div id="printOverlay" class="print-overlay" aria-hidden="true">
  <div id="printReport"></div>
</div>

<noscript>
  <div style="padding:24px;font-family:sans-serif">Este painel precisa de JavaScript habilitado para funcionar (todo o processamento é local).</div>
</noscript>

<script src="js/dados.js"></script>
<script src="js/config.js"></script>
<script src="js/analytics.js"></script>
<script src="js/charts.js"></script>
<script src="js/components.js"></script>
<script src="js/views.js"></script>
<script src="js/app.js"></script>
<script>window.addEventListener("load",function(){setTimeout(function(){var p=new URLSearchParams(location.search);var pm=p.get("meeting");if(pm){document.getElementById("btn-reuniao").click();var n=Math.max(1,parseInt(pm,10)||1);for(var i=1;i<n;i++)document.getElementById("meeting-next").click();}else if(p.get("resumo")==="1"){document.getElementById("btn-resumo").click();}var dd=p.get("dd");if(dd){var sel=document.getElementById(dd);var btn=sel&&sel.parentNode.querySelector(".dd-btn");if(btn)btn.click();}var alvo=p.get("only");if(alvo){var ids=alvo.split(",");var view=document.getElementById("view");Array.prototype.slice.call(view.children).forEach(function(c){if(!ids.some(function(id){return c.id===id||(c.querySelector&&c.querySelector("#"+id));}))c.remove();});var h=document.querySelector(".topbar");if(h)h.remove();var f=document.querySelector(".filterbar");if(f)f.remove();var f2=document.querySelector(".app-foot");if(f2)f2.remove();}},1600);});</script></body>
</html>
