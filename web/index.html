<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Profe · Painel de aprendizagem</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="css/app.css?v=6a2e4b17b855">
<link rel="stylesheet" href="css/balance.css?v=6a2e4b17b855">
<link rel="stylesheet" href="css/print.css?v=6a2e4b17b855" media="print">
</head>
<body>

<section id="auth-wall" class="auth-wall" aria-labelledby="login-title">
  <form id="login-form" class="login-form">
    <span class="login-logo" aria-hidden="true">
      <svg class="brand-mark" viewBox="0 0 44 44"><path d="M22 33c-5-3.2-10.5-4.1-16-2.1V11c5.5-2 11-1.1 16 2.1V33Zm0 0c5-3.2 10.5-4.1 16-2.1V11c-5.5-2-11-1.1-16 2.1V33Z"/><path d="M10.5 17c2.2-.4 4.4-.1 6.5.9M27 17.9c2.1-1 4.3-1.3 6.5-.9M9 35c4.5-1.1 8.8-.5 13 1.4 4.2-1.9 8.5-2.5 13-1.4"/><circle cx="22" cy="6.5" r="2.2"/></svg>
      <span id="login-title">Profe</span>
    </span>
    <label for="password">Senha</label>
    <div class="password-field"><input id="password" type="password" autocomplete="current-password" required aria-describedby="login-error"><button type="button" id="password-toggle" aria-pressed="false">Mostrar</button></div>
    <p id="login-error" class="login-error" role="alert"></p>
    <button id="login-submit" class="btn primary" type="submit">Entrar</button>
  </form>
</section>
<div class="shell" id="app" hidden>
  <a class="skip-link" href="#view">Pular para o conteúdo</a>
  <!-- ============================== CABEÇALHO ============================== -->
  <header class="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 44 44" role="img" aria-label="Profe"><path d="M22 33c-5-3.2-10.5-4.1-16-2.1V11c5.5-2 11-1.1 16 2.1V33Zm0 0c5-3.2 10.5-4.1 16-2.1V11c-5.5-2-11-1.1-16 2.1V33Z"/><path d="M10.5 17c2.2-.4 4.4-.1 6.5.9M27 17.9c2.1-1 4.3-1.3 6.5-.9M9 35c4.5-1.1 8.8-.5 13 1.4 4.2-1.9 8.5-2.5 13-1.4"/><circle cx="22" cy="6.5" r="2.2"/></svg>
      <div class="brand-text">
        <span class="brand-name">Profe</span>
        <span class="brand-sub">Escola Nova Lourenço Castanho</span>
      </div>
    </div>

    <nav class="filterbar" aria-label="Filtros do painel">
      <div class="filter filter-aluno">
        <label for="f-aluno">Aluno</label>
        <select id="f-aluno" data-empty-label="Alunos"></select>
      </div>
      <div class="filter">
        <label for="f-turma">Turma</label>
        <select id="f-turma" data-empty-label="Turmas"></select>
      </div>
      <div class="filter">
        <label for="f-disciplina">Disciplina</label>
        <select id="f-disciplina" data-empty-label="Disciplinas"></select>
      </div>
      <div class="filter">
        <label for="f-bimestre">Bimestre</label>
        <select id="f-bimestre" data-empty-label="Bimestres"></select>
      </div>
      <div class="filter">
        <label for="f-ano">Ano escolar</label>
        <select id="f-ano" data-empty-label="Anos"></select>
      </div>
      <div class="filter filter-limpar">
        <button type="button" id="btn-limpar" class="btn ghost">Limpar filtros</button>
      </div>
    </nav>
    <select id="f-ano-letivo" hidden aria-hidden="true"></select>
    <button id="btn-logout" class="logout-button" type="button" aria-label="Sair do painel" title="Sair do painel">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <path d="M10 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4"/>
        <path d="M14 16l4-4-4-4M18 12H9"/>
      </svg>
    </button>
  </header>

  <main id="view" class="view" tabindex="-1"></main>

  <!-- =============================== RODAPÉ =============================== -->
  <footer class="app-foot" title="Todo o processamento acontece localmente neste navegador; nenhum dado de estudante é enviado para servidores.">

    <nav class="nav-tabs" aria-label="Seções do painel">
      <button type="button" class="nav-tab" data-alvo="aluno">Visão geral</button>
      <button type="button" class="nav-tab" data-alvo="trajetoria">Trajetória</button>
      <button type="button" class="nav-tab" data-alvo="disciplinas-tabela">Disciplinas</button>
      <button type="button" class="nav-tab" data-alvo="contexto">Contexto</button>
      <button type="button" class="nav-tab" data-alvo="padroes">Padrões</button>
      <button type="button" class="nav-tab" data-alvo="detalhados">Dados</button>
    </nav>
    <span class="foot-sep" aria-hidden="true"></span>
    <div class="foot-actions">
      <span class="scope-line" id="scope-line" aria-live="polite"></span>
      <button type="button" class="chip-alertas oculto" id="chip-alertas">
        <span class="alerta-icone" aria-hidden="true"></span>
        Pontos de atenção <b id="chip-alertas-num">0</b>
      </button>
      <span id="nav-aluno" class="nav-aluno"></span>
      <button type="button" id="btn-reuniao" class="btn">Modo reunião</button>
      <button type="button" id="btn-resumo" class="btn primary">Gerar resumo</button>
    </div>
    <span class="visually-hidden">Dados individuais de estudantes — uso interno da escola. Todo o processamento acontece localmente neste navegador.</span>
  </footer>
</div>

<!-- ============================== MODO REUNIÃO ============================= -->
<div id="meeting" class="meeting" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Modo reunião">
  <header class="meeting-head">
    <span class="meeting-brand">
      <svg class="brand-mark" viewBox="0 0 44 44" aria-hidden="true"><path d="M22 33c-5-3.2-10.5-4.1-16-2.1V11c5.5-2 11-1.1 16 2.1V33Zm0 0c5-3.2 10.5-4.1 16-2.1V11c-5.5-2-11-1.1-16 2.1V33Z"/><path d="M10.5 17c2.2-.4 4.4-.1 6.5.9M27 17.9c2.1-1 4.3-1.3 6.5-.9M9 35c4.5-1.1 8.8-.5 13 1.4 4.2-1.9 8.5-2.5 13-1.4"/><circle cx="22" cy="6.5" r="2.2"/></svg>
      <span>Profe</span>
    </span>
    <div id="meeting-step-head" class="meeting-step-head"></div>
    <div class="meeting-actions">
      <button type="button" id="meeting-print" class="btn">Gerar resumo</button>
      <button type="button" id="meeting-close" class="btn ghost">Sair (Esc)</button>
    </div>
  </header>
  <div id="meeting-body" class="meeting-body"></div>
  <footer class="meeting-foot">
    <button type="button" id="meeting-prev" class="btn">← Anterior</button>
    <div class="meeting-foot-centro">
      <div id="meeting-progress" class="meeting-progress" role="group" aria-label="Passos da reunião"></div>
      <span id="meeting-step-label" class="meeting-step-label"></span>
      <span id="meeting-aluno" class="meeting-aluno"></span>
    </div>
    <button type="button" id="meeting-next" class="btn primary">Próximo →</button>
  </footer>
</div>

<!-- ============================ RESUMO IMPRESSO ============================ -->
<div id="printOverlay" class="print-overlay" aria-hidden="true">
  <div id="printReport"></div>
</div>

<noscript>
  <div style="padding:24px;font-family:sans-serif">Este painel precisa de JavaScript habilitado para funcionar (todo o processamento é local).</div>
</noscript>

<script src="js/dados.enc.js?v=6a2e4b17b855"></script>
<script src="js/config.js?v=6a2e4b17b855"></script>
<script src="js/analytics.js?v=6a2e4b17b855"></script>
<script src="js/charts.js?v=6a2e4b17b855"></script>
<script src="js/components.js?v=6a2e4b17b855"></script>
<script src="js/views.js?v=6a2e4b17b855"></script>
<script src="js/app.js?v=6a2e4b17b855"></script>
<script src="js/auth.js?v=6a2e4b17b855"></script>
<script type="module" src="js/analytics-init.js?v=6a2e4b17b855"></script>
</body>
</html>
